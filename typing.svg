
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="92" viewBox="0 0 520 92" role="img" aria-label="Adam's GitHub welcome message">
  <style>
    .title {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      fill: #8b949e;
    }

    .terminal-text {
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #58a6ff;
    }

    .prompt { fill: #3fb950; }

    .frame {
      opacity: 0;
      transform: translateY(4px);
    }

    .frame1 { animation: show-frame-1 16s infinite; }
    .frame2 { animation: show-frame-2 16s infinite; }
    .frame3 { animation: show-frame-3 16s infinite; }
    .frame4 { animation: show-frame-4 16s infinite; }

    .cursor {
      fill: #58a6ff;
      animation: blink 0.85s step-end infinite;
    }

    @keyframes show-frame-1 {
      0%, 3% { opacity: 0; transform: translateY(4px); }
      7%, 22% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes show-frame-2 {
      0%, 25% { opacity: 0; transform: translateY(4px); }
      29%, 47% { opacity: 1; transform: translateY(0); }
      50%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes show-frame-3 {
      0%, 50% { opacity: 0; transform: translateY(4px); }
      54%, 72% { opacity: 1; transform: translateY(0); }
      75%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes show-frame-4 {
      0%, 75% { opacity: 0; transform: translateY(4px); }
      79%, 97% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .frame, .cursor { animation: none; }
      .frame1 { opacity: 1; transform: none; }
    }
  </style>

  <!-- Terminal window -->
  <rect width="520" height="92" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="519" height="91" rx="11.5" fill="none" stroke="#30363d"/>

  <!-- Window header -->
  <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5" fill="#febc2e"/>
  <circle cx="58" cy="20" r="5" fill="#28c840"/>
  <text x="260" y="24" text-anchor="middle" class="title">Adam-loy@github:~</text>
  <line x1="16" y1="36" x2="504" y2="36" stroke="#21262d"/>

  <!-- Prompt -->
  <text x="22" y="66" class="terminal-text prompt">~❯</text>

  <!-- Frame 1 -->
  <g class="frame frame1">
    <text x="50" y="66" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif" font-size="20">👋</text>
    <text x="76" y="66" class="terminal-text">Hi there, I'm Adam.</text>
    <rect x="260" y="49" width="9" height="20" rx="1" class="cursor"/>
  </g>

  <!-- Frame 2 -->
  <g class="frame frame2">
    <text x="50" y="66" class="terminal-text">You're on my GitHub page.</text>
    <rect x="290" y="49" width="9" height="20" rx="1" class="cursor"/>
  </g>

  <!-- Frame 3 -->
  <g class="frame frame3">
    <text x="50" y="66" class="terminal-text">Sorry, there's not much here yet.</text>
    <rect x="367" y="49" width="9" height="20" rx="1" class="cursor"/>
  </g>

  <!-- Frame 4 -->
  <g class="frame frame4">
    <text x="50" y="66" class="terminal-text">Updates will be posted soon.</text>
    <rect x="319" y="49" width="9" height="20" rx="1" class="cursor"/>
  </g>
</svg>
