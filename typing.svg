<svg xmlns="http://www.w3.org/2000/svg" width="380" height="40" viewBox="0 0 380 40">
  <style>
    .terminal-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 18px;
      fill: #2f81f7;
      font-weight: bold;
    }

    .prompt { fill: #3fb950; }

    /* Word Reveals */
    .word1 { animation: revealWord1 6s infinite; }
    .word2 { animation: revealWord2 6s infinite; }
    .word3 { animation: revealWord3 6s infinite; }

    /* Dot-by-dot Reveals */
    .dot1 { animation: revealDot1 6s infinite; }
    .dot2 { animation: revealDot2 6s infinite; }
    .dot3 { animation: revealDot3 6s infinite; }

    /* Cursor Animations */
    .cursor {
      fill: #58a6ff;
      animation: blink 0.8s infinite, moveCursor 6s infinite;
    }

    @keyframes revealWord1 {
      0%, 8% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }

    @keyframes revealWord2 {
      0%, 13% { opacity: 0; }
      14%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes revealWord3 {
      0%, 19% { opacity: 0; }
      20%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes revealDot1 {
      0%, 25% { opacity: 0; }
      26%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes revealDot2 {
      0%, 31% { opacity: 0; }
      32%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes revealDot3 {
      0%, 37% { opacity: 0; }
      38%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes moveCursor {
      0%, 8% { transform: translateX(0px); }
      14% { transform: translateX(52px); }
      20% { transform: translateX(92px); }
      26% { transform: translateX(180px); }
      31% { transform: translateX(192px); }
      36% { transform: translateX(204px); }
      41%, 85% { transform: translateX(216px); }
      92%, 100% { transform: translateX(0px); }
    }
  </style>

  <!-- Shell Prompt Icon -->
  <text x="10" y="25" class="terminal-text prompt">&gt;</text>

  <!-- Word Sequence -->
  <text x="30" y="25" class="terminal-text word1">wait</text>
  <text x="82" y="25" class="terminal-text word2">for</text>
  <text x="122" y="25" class="terminal-text word3">updates</text>

  <!-- Dot Sequence -->
  <text x="210" y="25" class="terminal-text dot1">.</text>
  <text x="222" y="25" class="terminal-text dot2">.</text>
  <text x="234" y="25" class="terminal-text dot3">.</text>

  <!-- Dynamic Cursor -->
  <rect x="30" y="10" width="10" height="18" class="cursor" />
</svg>
