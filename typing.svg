<svg xmlns="http://www.w3.org/2000/svg" width="380" height="40" viewBox="0 0 380 40">
  <style>
    .terminal-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 18px;
      fill: #2f81f7;
      font-weight: bold;
    }

    /* Word reveal animations */
    .word-1 { animation: showWord 6s infinite; }
    .word-2 { animation: showWord 6s infinite 0.4s; opacity: 0; }
    .word-3 { animation: showWord 6s infinite 0.8s; opacity: 0; }

    /* Dot-by-dot character reveals */
    .dot-1 { animation: showDot 6s infinite 1.3s; opacity: 0; }
    .dot-2 { animation: showDot 6s infinite 1.6s; opacity: 0; }
    .dot-3 { animation: showDot 6s infinite 1.9s; opacity: 0; }

    /* Blinking Cursor */
    .cursor {
      animation: blink 0.8s infinite, moveCursor 6s infinite;
    }

    @keyframes showWord {
      0%, 10% { opacity: 0; }
      15%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes showDot {
      0%, 10% { opacity: 0; }
      15%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes moveCursor {
      0%, 10% { transform: translateX(0px); }
      12% { transform: translateX(50px); }
      14% { transform: translateX(85px); }
      18% { transform: translateX(180px); }
      21% { transform: translateX(192px); }
      24% { transform: translateX(204px); }
      27%, 85% { transform: translateX(216px); }
      92%, 100% { transform: translateX(0px); }
    }
  </style>

  <g transform="translate(10, 25)">
    <!-- Terminal Prompt Icon -->
    <text x="0" y="0" class="terminal-text" fill="#3fb950">&gt;</text>
    
    <!-- Words reveal as whole blocks -->
    <g transform="translate(20, 0)">
      <tspan class="word-1" x="0">wait </tspan>
      <tspan class="word-2" x="50">for </tspan>
      <tspan class="word-3" x="85">updates</tspan>
      
      <!-- Dots reveal one character at a time -->
      <tspan class="dot-1" x="180">.</tspan>
      <tspan class="dot-2" x="192">.</tspan>
      <tspan class="dot-3" x="204">.</tspan>
    </g>

    <!-- Typing Cursor -->
    <rect class="cursor" x="20" y="-16" width="10" height="20" fill="#58a6ff" />
  </g>
</svg>
